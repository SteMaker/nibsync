# Memory caps: the dev PC (15 GB, also running other Java services) froze once when the
# Gradle daemon, the Kotlin daemon (which otherwise inherits the Gradle heap), lint, test JVMs
# and the PC app all grew at the same time and swap ran full.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep the app (and its notes) installed after connectedAndroidTest. By default AGP
# uninstalls the tested app afterwards, which wipes all documents on the device.
android.injected.androidTest.leaveApksInstalledAfterRun=true
