# Builds the PC app packages: .msi and a portable .zip on Windows, .deb on Linux. Each package
# format can only be built on its own system. Runs by hand ("Run workflow") and for version tags
# (v1.2.3), which also publish the packages as a GitHub release.
#
# The OAuth client ids come from the repository secret CLOUD_PROPERTIES (the content of
# cloud.properties, see cloud.properties.example); without it the cloud logins are unavailable.
name: PC packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktop:packageMsi :desktop:createDistributable"
          # The oldest supported Ubuntu: a .deb only installs on systems at least as new.
          - os: ubuntu-24.04
            tasks: ":desktop:packageDeb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: OAuth clients
        shell: bash
        env:
          CLOUD_PROPERTIES: ${{ secrets.CLOUD_PROPERTIES }}
        run: |
          if [ -n "$CLOUD_PROPERTIES" ]; then
            printf '%s\n' "$CLOUD_PROPERTIES" > cloud.properties
          else
            echo "::warning::Secret CLOUD_PROPERTIES is not set: OneDrive and Google Drive logins will be unavailable."
          fi

      - name: Build
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3; hand-started runs keep the default version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export NIBSYNC_VERSION="${GITHUB_REF_NAME#v}"; fi
          ./gradlew --no-daemon ${{ matrix.tasks }}

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/nibsync -DestinationPath desktop/build/compose/binaries/main/nibsync-windows-portable.zip

      - uses: actions/upload-artifact@v5
        with:
          name: nibsync-${{ runner.os }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/* --repo "${GITHUB_REPOSITORY}" --title "NibSync ${GITHUB_REF_NAME}" --generate-notes
